server.port=8091

spring.datasource.url=jdbc:h2:file:./data/leaddb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- AI qualification ----
# rule   = free, built-in scoring (default, no API key needed)
# claude = uses the Anthropic Messages API (set ANTHROPIC_API_KEY)
app.ai.provider=${AI_PROVIDER:rule}
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# ---- Webhook (Zapier / Make.com catch-hook URL). Leave blank to only log. ----
app.webhook.url=${WEBHOOK_URL:}

# ---- CORS origins for the web app and Expo web ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:8081,http://localhost:19006
